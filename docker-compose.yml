services:
  app:
    build: .
    container_name: dualagent_app
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      oracle:
        condition: service_healthy
    networks:
      - dualagent_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: dualagent_oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: tiger
      APP_USER: sania
      APP_USER_PASSWORD: sania123
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - dualagent_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sqlplus", "-V"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  oracle_data:

networks:
  dualagent_net:
  